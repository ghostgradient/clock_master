<!DOCTYPE html>
<html lang="en" data-theme="oled">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Master Clock">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<title>Clock of Master</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
<script>try{var t=localStorage.getItem('clockOfMaster.theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font-ui:'Sora',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --font-num:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --num-w:300;
  --ga:.42; --gb:22px;
  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --bg:#000; --text:#e9f1ec; --dim:#9aa9a0; --mute:#5f6d66;
  --panel:rgba(12,14,16,.94); --panel-2:rgba(24,27,30,.92);
  --line:rgba(255,255,255,.09); --line-hot:rgba(255,255,255,.2);
  --accent:#35f08a; --accent-ink:#00150a; --gold:#ffd166; --dyellow:#c9a227;
  --timer:#ff9540; --danger:#ff5468; --info:#5b90d0;
  --btn:rgba(255,255,255,.07); --btn-hot:rgba(255,255,255,.13);
  --tab-on:rgba(53,240,138,.13); --tab-on-ink:#35f08a;
  --spec:inset 0 1px 0 rgba(255,255,255,.05);
  --shadow:0 0 0 transparent;
  --blur:none;
  --track:rgba(255,255,255,.08);
  --face:#0c0e10; --face-ink:#e9f1ec; --face-night:#000; --face-night-ink:#e9f1ec;
  --scrim:rgba(0,0,0,.72);
  color-scheme:dark;
}
html[data-theme="oled"]{ --r-xl:22px; --r-lg:18px; }
html[data-theme="glass"]{
  --font-ui:-apple-system,BlinkMacSystemFont,'SF Pro Display','Sora',system-ui,sans-serif;
  --font-num:-apple-system,BlinkMacSystemFont,'SF Pro Display','Sora',system-ui,sans-serif;
  --num-w:200;
  --bg:#e9edf5; --text:#0d0f14; --dim:#4c5261; --mute:#868c9b;
  --panel:rgba(255,255,255,var(--ga,.42)); --panel-2:rgba(255,255,255,calc(var(--ga,.42) + .22));
  --line:rgba(255,255,255,.72); --line-hot:rgba(255,255,255,.98);
  --accent:#28b44e; --accent-ink:#fff; --gold:#ff9f0a; --dyellow:#e08600;
  --timer:#ff9500; --danger:#ff3b30; --info:#007aff;
  --btn:rgba(255,255,255,.55); --btn-hot:rgba(255,255,255,.85);
  --tab-on:rgba(255,255,255,.92); --tab-on-ink:#0d0f14;
  --spec:0 1px 1px rgba(255,255,255,.95) inset,0 -14px 24px rgba(255,255,255,.28) inset;
  --shadow:0 12px 32px rgba(30,34,50,.12),0 2px 6px rgba(30,34,50,.06);
  --blur:blur(var(--gb,22px)) saturate(190%);
  --track:rgba(20,24,40,.09);
  --face:#fff; --face-ink:#0d0f14; --face-night:#101218; --face-night-ink:#fff;
  --scrim:rgba(20,24,40,.28);
  color-scheme:light;
}
html[data-theme="glassdark"]{
  --font-ui:-apple-system,BlinkMacSystemFont,'SF Pro Display','Sora',system-ui,sans-serif;
  --font-num:-apple-system,BlinkMacSystemFont,'SF Pro Display','Sora',system-ui,sans-serif;
  --num-w:200;
  --bg:#06070c; --text:#f4f6fb; --dim:#a7adbd; --mute:#6c7285;
  --panel:rgba(30,32,42,var(--ga,.42)); --panel-2:rgba(46,49,62,calc(var(--ga,.42) + .15));
  --line:rgba(255,255,255,.14); --line-hot:rgba(255,255,255,.3);
  --accent:#30d158; --accent-ink:#00150a; --gold:#ffd60a; --dyellow:#ff9f0a;
  --timer:#ff9f0a; --danger:#ff453a; --info:#0a84ff;
  --btn:rgba(255,255,255,.1); --btn-hot:rgba(255,255,255,.18);
  --tab-on:rgba(255,255,255,.16); --tab-on-ink:#fff;
  --spec:0 1px 0 rgba(255,255,255,.18) inset,0 -12px 24px rgba(255,255,255,.04) inset;
  --shadow:0 14px 36px rgba(0,0,0,.35);
  --blur:blur(var(--gb,22px)) saturate(180%);
  --track:rgba(255,255,255,.1);
  --face:#fff; --face-ink:#0d0f14; --face-night:#15171e; --face-night-ink:#fff;
  --scrim:rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  transition:background-color .4s var(--ease)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.015em}
h2{font-size:20px}
h3{font-size:15px}
.dim{color:var(--dim)} .mute{color:var(--mute)}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── background ───────────────────────── */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
html[data-theme="oled"] .bg{display:none}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.9;will-change:transform}
.b1{width:48vmax;height:48vmax;left:-12vmax;top:-14vmax;background:#ff9ec7}
.b2{width:44vmax;height:44vmax;right:-14vmax;top:-6vmax;background:#7ab8ff}
.b3{width:40vmax;height:40vmax;left:20vmax;bottom:-18vmax;background:#ffd36e}
.b4{width:34vmax;height:34vmax;right:4vmax;bottom:-8vmax;background:#8ef0bf}
.b5{width:28vmax;height:28vmax;left:38vmax;top:22vh;background:#bba0ff;opacity:.7}
html[data-theme="glassdark"] .b1{background:#5b2cff;opacity:.55}
html[data-theme="glassdark"] .b2{background:#0070f3;opacity:.5}
html[data-theme="glassdark"] .b3{background:#ff2d87;opacity:.38}
html[data-theme="glassdark"] .b4{background:#00b894;opacity:.35}
html[data-theme="glassdark"] .b5{background:#ff9f0a;opacity:.25}
html.mo .b1{animation:drift1 26s ease-in-out infinite alternate}
html.mo .b2{animation:drift2 31s ease-in-out infinite alternate}
html.mo .b3{animation:drift1 37s ease-in-out infinite alternate-reverse}
html.mo .b4{animation:drift2 29s ease-in-out infinite alternate-reverse}
html.mo .b5{animation:drift3 23s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(8vmax,6vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-7vmax,9vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(-10vmax,-6vmax) scale(1.2)}}

/* ── no-JS fallback (visible by default, removed by boot) ── */
.nojs{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:32px max(28px,calc(50% - 320px));
  background:#000;color:#e9f1ec;font-family:-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.55;font-size:17px}
.nojs h1{font-size:26px;color:#35f08a}
.nojs p{margin:0}
/* ── shell ───────────────────────── */
.shell{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(18px,env(safe-area-inset-right)) 8px max(18px,env(safe-area-inset-left));min-height:64px}
.tb-left,.tb-right{display:flex;align-items:center;gap:8px;min-width:0}
.tb-right{justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--spec);
  font-size:13px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;transition:transform .25s var(--spring),background .2s}
.chip:active{transform:scale(.94)}
.chip b{color:var(--gold);font-family:var(--font-num)}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);
  background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--spec);transition:transform .25s var(--spring),background .2s;flex:none}
.ibtn:hover{background:var(--panel-2)}
.ibtn:active{transform:scale(.9)}
.ibtn svg{width:20px;height:20px}
.center-slot{position:relative;display:grid;place-items:center;min-width:180px;height:44px}
.datebox{text-align:center;transition:opacity .35s var(--ease),transform .45s var(--spring)}
.datebox .d{font-weight:600;font-size:16px}
.datebox .t{font-size:12px;color:var(--dim)}
.center-slot.live .datebox{opacity:0;transform:scale(.8) translateY(-6px);pointer-events:none}

/* island (live activity) */
.island{position:absolute;display:flex;align-items:center;gap:10px;height:42px;padding:0 14px 0 6px;border-radius:999px;background:#000;color:#fff;
  border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.35);white-space:nowrap;
  opacity:0;transform:scale(.55);pointer-events:none;transition:transform .55s var(--spring),opacity .3s var(--ease);max-width:min(560px,70vw);overflow:hidden}
.center-slot.live .island{opacity:1;transform:none;pointer-events:auto;cursor:pointer}
.isl-item{display:flex;align-items:center;gap:8px;min-width:0}
.isl-item+.isl-item{padding-left:10px;border-left:1px solid rgba(255,255,255,.16)}
.isl-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.isl-dot svg{width:14px;height:14px}
.isl-name{font-size:12px;color:rgba(255,255,255,.7);max-width:150px;overflow:hidden;text-overflow:ellipsis}
.isl-time{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600}
html.mo .isl-dot.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,255,255,.08)}}

main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:6px max(18px,env(safe-area-inset-right)) calc(120px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left))}
.view:not(.active){display:none}
.wrap{max-width:1240px;margin:0 auto}
html.mo .view.active>.wrap>*{animation:rise .5s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@supports (-webkit-touch-callout:none){
  html.mo .view.active>.wrap>*{animation:none!important;opacity:1!important;transform:none!important}
}

/* tab bar */
.tabbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:20;
  display:flex;gap:2px;padding:6px;border-radius:999px;max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--spec),var(--shadow),0 10px 40px rgba(0,0,0,.25);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
html[data-theme="oled"] .tabbar{background:rgba(10,12,14,.96)}
.tabbar::-webkit-scrollbar{display:none}
.tab-ind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:999px;background:var(--tab-on);
  box-shadow:var(--spec);transition:left .55s var(--spring),width .55s var(--spring);pointer-events:none}
.tab{position:relative;appearance:none;border:0;background:transparent;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 12px 6px;border-radius:999px;font-size:11px;font-weight:600;min-width:66px;transition:color .25s,transform .25s var(--spring)}
.tab svg{width:22px;height:22px}
.tab.active{color:var(--tab-on-ink)}
.tab:active{transform:scale(.9)}

/* panels & primitives */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);
  box-shadow:var(--spec),var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);padding:20px}
html[data-theme="glass"] .panel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.5),transparent 42%);mix-blend-mode:overlay}
html[data-theme="oled"] .panel{transition:border-color .25s}
html[data-theme="oled"] .panel:hover{border-color:rgba(201,162,39,.35)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  html[data-theme="glass"] .panel,html[data-theme="glass"] .tabbar{background:rgba(255,255,255,.9)}
  html[data-theme="glassdark"] .panel,html[data-theme="glassdark"] .tabbar{background:rgba(30,32,42,.94)}
}
@media (prefers-reduced-transparency:reduce){
  html[data-theme="glass"] .panel{background:rgba(255,255,255,.95);backdrop-filter:none;-webkit-backdrop-filter:none}
  html[data-theme="glassdark"] .panel{background:rgba(30,32,42,.96);backdrop-filter:none;-webkit-backdrop-filter:none}
}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:32px}
.ph h2,.ph h3{min-width:0}
.ph .sub{font-size:12px;color:var(--dim);font-weight:500}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g-hero{grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.row.wrapf{flex-wrap:wrap}
.spacer{flex:1}
@media (max-width:900px){.g2,.g-hero{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){
  .g3{grid-template-columns:minmax(0,1fr)}.panel{padding:16px}.tab{min-width:56px;padding:7px 8px 6px}
  .topbar{grid-template-columns:auto minmax(0,1fr) auto;gap:8px}
  .center-slot{min-width:0}
  .island{max-width:100%;padding-right:10px}
  .isl-name{display:none}
  .datebox .d{font-size:14px}
  .ibtn{width:36px;height:36px}
  .tb-right{gap:6px}
  #ddChip{max-width:108px;padding:0 10px}
  .city .tm{font-size:28px}
  .city{gap:10px;padding:10px}
  .city>svg{width:70px;height:70px}
  .subj{gap:10px;padding:10px 4px}
  .subj .nm{font-size:15px}
  .kpi .v{font-size:21px}
  .datenav .lbl{min-width:0;font-size:14px}
}
@media (max-width:420px){
  .tab{min-width:46px;padding:10px 8px}
  .tab span{display:none}
  .tab svg{width:24px;height:24px}
  .city>svg{width:52px;height:52px}
  .city .tm{font-size:26px}
  .city .cinfo .dim{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn.round{width:74px;height:74px}
}

.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;
  border:1px solid var(--line);background:var(--btn);font-weight:600;font-size:14px;white-space:nowrap;
  transition:transform .25s var(--spring),background .2s,box-shadow .2s,opacity .2s}
.btn:hover{background:var(--btn-hot)}
.btn:active{transform:scale(.94)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn svg{width:18px;height:18px}
.btn.sm{height:34px;padding:0 13px;font-size:13px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.warn{background:var(--timer);color:#1a0d00;border-color:transparent}
.btn.bad{background:color-mix(in srgb,var(--danger) 22%,transparent);color:var(--danger);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.round{width:84px;height:84px;padding:0;border-radius:50%;font-size:15px;box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px currentColor}
html[data-theme^="glass"] .btn.round{box-shadow:var(--spec),0 6px 20px rgba(0,0,0,.12)}
.btn.round.go{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.btn.round.stop{background:color-mix(in srgb,var(--danger) 22%,transparent);color:var(--danger)}
.btn.round.go2{background:color-mix(in srgb,var(--timer) 24%,transparent);color:var(--timer)}
.btn.round.neutral{background:var(--btn);color:var(--text)}

.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--track);position:relative;gap:2px}
.seg button{appearance:none;border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--dim);transition:background .3s var(--ease),color .2s}
.seg button.on{background:var(--panel-2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
html[data-theme="oled"] .seg button.on{background:rgba(53,240,138,.14);color:var(--accent)}

.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--dim);font-weight:600}
.inp{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--track);padding:0 12px;font-size:14px;color:var(--text);font-weight:500}
.inp:focus{outline:none;border-color:var(--info)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=range]{width:100%;accent-color:var(--accent)}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--track);transition:background .25s}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(20px)}

.empty{padding:26px 10px;text-align:center;color:var(--dim);font-size:14px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--track);color:var(--dim)}
.kpi{padding:16px 18px}
.kpi .k{font-size:12px;color:var(--dim);font-weight:600}
.kpi .v{font-size:26px;font-weight:600;margin-top:2px}
.kpi .s{font-size:12px;color:var(--mute)}
html[data-theme="oled"] .kpi .v{color:var(--text)}

/* ── today ───────────────────────── */
.dial-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.dial{width:min(100%,400px);aspect-ratio:1;display:block}
.dial .seg-arc{transition:opacity .3s}
html.mo .dial .arcs{animation:spinIn 1s var(--ease)}
@keyframes spinIn{from{transform:rotate(-40deg);opacity:0}}
.dial .arcs{transform-origin:200px 200px}
.dial-total{font-family:var(--font-num);font-weight:var(--num-w);font-size:46px;letter-spacing:-.02em;fill:var(--text)}
html[data-theme="oled"] .running .dial-total{fill:var(--accent)}
.dial-cap{font-size:13px;fill:var(--dim);font-weight:600}
.dial-hand{transition:transform 1s linear}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.subj{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:18px;transition:background .3s var(--ease),transform .3s var(--spring)}
.subj+.subj{margin-top:2px}
.subj:hover{background:var(--track)}
.subj.on{background:color-mix(in srgb,var(--c) 14%,transparent)}
.play{width:46px;height:46px;border-radius:50%;border:0;flex:none;display:grid;place-items:center;background:var(--c);color:#fff;position:relative;
  transition:transform .3s var(--spring)}
.play:active{transform:scale(.86)}
.play svg{width:18px;height:18px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}

.ruler:active{cursor:grabbing}

.scrim{position:fixed;inset:0;z-index:50;pointer-events:none;background:var(--scrim);opacity:0;transition:opacity .3s var(--ease)}

  drawFocus();

}

  try { wakeLock && wakeLock.release(); } catch (e) { } wakeLock = null;
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) { }

}

      </div>

function focusClick(e) {
  const b = e.target.closest('[data-f]'); if (!b) return;
  const k = b.dataset.f;
  if (k === 'exit') return closeFocus();

  if (k === 'break') { const br = S.subjects.find(x => x.kind === 'break'); if (br) startSubject(br.id); else stopSubject(); }
  if (k === 'go') { S.pomo.on = false; startSubject(b.dataset.sid); }
  drawFocus(true);
}

/* ═══ AUDIO ══════════════════════════════════════════ */
let AC = null;
function ac() {
  try {
    if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
    if (AC && AC.state === 'suspended') AC.resume();
  } catch (e) { }
  return AC;
}
function chime(kind = 'done') {
  if (!S.settings.sound) return;
  const a = ac(); if (!a) return;
  const t = a.currentTime;
  const notes = kind === 'alarm' ? [988, 1319, 988, 1319, 1568] : kind === 'soft' ? [660, 880] : [880, 1175, 1568];
  notes.forEach((f, i) => {
    const o = a.createOscillator(), g = a.createGain(), st = t + i * .17;
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(.28, st + .02);
    g.gain.exponentialRampToValueAtTime(.0001, st + .95);
    o.connect(g); g.connect(a.destination);
    o.start(st); o.stop(st + 1);
  });
}

/* ═══ SVG helpers ════════════════════════════════════ */
function polar(cx, cy, r, deg) { const a = (deg - 90) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
function arcPath(cx, cy, r, a0, a1) {
  if (a1 - a0 >= 359.99) a1 = a0 + 359.99;
  const [x0, y0] = polar(cx, cy, r, a0), [x1, y1] = polar(cx, cy, r, a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
function wedgePath(cx, cy, r0, r1, a0, a1) {
  const [x0, y0] = polar(cx, cy, r1, a0), [x1, y1] = polar(cx, cy, r1, a1), [x2, y2] = polar(cx, cy, r0, a1), [x3, y3] = polar(cx, cy, r0, a0);
  const L = a1 - a0 > 180 ? 1 : 0;
  return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r1} ${r1} 0 ${L} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}A${r0} ${r0} 0 ${L} 0 ${x3.toFixed(1)} ${y3.toFixed(1)}Z`;
}

/* ═══ TODAY ══════════════════════════════════════════ */
function dayDial(k) {
  const a = dayAgg(k), s0 = startOf(k), now = Date.now();
  const goal = S.settings.goalMin * MIN, pct = goal ? clamp(a.study / goal, 0, 1) : 0;
  const ang = t => (t - s0) / DAY * 360;
  let arcs = '';
  for (const s of a.list) {
    const a0 = ang(s.s0), a1 = Math.max(ang(s.e0), a0 + .6);
    arcs += `<path class="seg-arc" d="${arcPath(200, 200, 160, a0, a1)}" stroke="${colorOf(s.sid)}" stroke-width="26" fill="none" ${s.live ? 'data-live-arc="1"' : ''} data-tip="${esc(nameOf(s.sid))} · ${clockHM(s.s0)}–${clockHM(s.e0)} · ${hm(s.e0 - s.s0)}"/>`;
  }
  let ticks = '';
  for (let h = 0; h < 24; h++) {
    const [x0, y0] = polar(200, 200, 182, h * 15), [x1, y1] = polar(200, 200, h % 6 ? 187 : 192, h * 15);
    ticks += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="currentColor" stroke-opacity="${h % 6 ? .25 : .6}" stroke-width="${h % 6 ? 1.2 : 2}"/>`;
    if (h % 3 === 0) {
      const [tx, ty] = polar(200, 200, 132, h * 15);
      ticks += `<text x="${tx.toFixed(1)}" y="${(ty + 4).toFixed(1)}" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity=".5" font-family="var(--font-num)">${pad((h + ds()) % 24)}</text>`;
    }
  }
  const na = k === todayKey() ? ang(now) : null;
  const C = 2 * Math.PI * 112;
  return `<svg class="dial ${S.running ? 'running' : ''}" viewBox="0 0 400 400" role="img" aria-label="Day dial: ${hm(a.study)} studied today">
    <circle cx="200" cy="200" r="160" fill="none" stroke="var(--track)" stroke-width="26"/>
    <g style="color:var(--text)">${ticks}</g>
    <g class="arcs">${arcs}</g>
    <circle cx="200" cy="200" r="112" fill="none" stroke="var(--track)" stroke-width="5"/>
    <circle cx="200" cy="200" r="112" fill="none" stroke="var(--gold)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct)).toFixed(1)}" transform="rotate(-90 200 200)" style="transition:stroke-dashoffset 1.2s var(--ease)" id="goalRing"/>
    ${na !== null ? `<g class="dial-hand" id="dialHand" style="transform-origin:200px 200px;transform:rotate(${na.toFixed(2)}deg)"><line x1="200" y1="52" x2="200" y2="20" stroke="var(--danger)" stroke-width="3" stroke-linecap="round"/><circle cx="200" cy="18" r="5" fill="var(--danger)"/></g>` : ''}
    <text x="200" y="176" text-anchor="middle" class="dial-cap">${k === todayKey() ? 'Studied today' : fmtKey(k)}</text>
    <text x="200" y="222" text-anchor="middle" class="dial-total" data-live="total">${hms(a.study)}</text>
    <text x="200" y="250" text-anchor="middle" class="dial-cap" data-live="goalcap">${Math.round(pct * 100)}% of ${hm(goal)} goal</text>
  </svg>`;
}
function timelineStrip(k, h = 30) {

/* ═══ TIMERS ═════════════════════════════════════════ */
let pick = 15 * MIN;              // selected duration in ms
let pickLabel = '', pickSid = '';
const PRESETS = [1, 3, 5, 10, 15, 25, 30, 45, 60, 90].map(m => m * MIN);

/* ruler mapping: first half = 0–15 min in 15 s steps, second half = 15–180 min in 1 min steps */
function fracToMs(f) {
  f = clamp(f, 0, 1);
  if (f <= .5) return Math.round(f / .5 * 60) * 15 * SEC;
  return Math.round(15 + (f - .5) / .5 * 165) * MIN;
}
function msToFrac(ms) {
  const m = ms / MIN;
  if (m <= 15) return m / 15 * .5;
  return .5 + clamp((m - 15) / 165, 0, 1) * .5;
}
function startTimer(dur, label, sid) {
  if (dur < SEC) return toast('Pick a duration first');
  S.timers.push({ id: uid(), label: label || '', dur, sid: sid || '', state: 'run', endAt: Date.now() + dur, remain: dur });
  S.recents = [{ dur, label: label || '' }, ...S.recents.filter(r => !(r.dur === dur && r.label === (label || '')))].slice(0, 8);
  if (sid) startSubject(sid, true);
  ac(); saveNow(); refresh();
}
function timerAction(id, act) {
  const t = S.timers.find(x => x.id === id); if (!t) return;
  const now = Date.now();
  if (act === 'pause' && t.state === 'run') { t.remain = t.endAt - now; t.state = 'pause'; }
  else if (act === 'resume' && t.state === 'pause') { t.endAt = now + t.remain; t.state = 'run'; }
  else if (act === 'cancel') S.timers = S.timers.filter(x => x.id !== id);
  else if (act === 'repeat') { t.state = 'run'; t.endAt = now + t.dur; t.remain = t.dur; }
  else if (act === '+1') { if (t.state === 'run') t.endAt += MIN; else t.remain += MIN; t.dur += MIN; }
  saveNow(); refresh();
}
function checkTimers() {
  const now = Date.now();
  for (const t of S.timers) {
    if (t.state === 'run' && now >= t.endAt) {
      t.state = 'done';
      S.timerLog.push({ t: now, dur: t.dur, label: t.label });
      if (S.timerLog.length > 500) S.timerLog = S.timerLog.slice(-500);
      if (t.sid && S.running && S.running.sid === t.sid && !S.pomo.on) stopSubject(now, true);
      saveNow();
      startRinging('done');

  for (let i = 0; i < 12; i++) { const [x0, y0] = polar(50, 50, 45, i * 30), [x1, y1] = polar(50, 50, i % 3 ? 42 : 39, i * 30); t += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="currentColor" stroke-width="${i % 3 ? 1 : 2}"/>`; }
  return `<svg viewBox="0 0 100 100" style="color:${night ? 'var(--face-night-ink)' : 'var(--face-ink)'}" data-face="${id}">
    <circle cx="50" cy="50" r="48" fill="${night ? 'var(--face-night)' : 'var(--face)'}" stroke="var(--line)"/>${t}
    <g class="hand" data-h><line x1="50" y1="53" x2="50" y2="27" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></g>
    <g class="hand" data-m><line x1="50" y1="54" x2="50" y2="12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></g>
    <g class="hand" data-s><line x1="50" y1="58" x2="50" y2="9" stroke="var(--timer)" stroke-width="1.2" stroke-linecap="round"/><circle cx="50" cy="50" r="2.6" fill="var(--timer)"/></g>
  </svg>`;
}
let tzList = null;

}

function checkAlarms() {
  const d = new Date(), hmNow = pad(d.getHours()) + ':' + pad(d.getMinutes());
  const stamp = d.toDateString() + ' ' + hmNow;
  for (const a of S.alarms) {
    const due = a.on && (a.snooze ? Date.now() >= a.snooze : (a.time === hmNow && (!a.days.length || a.days.includes(d.getDay())) && a.last !== stamp));
    if (!due) continue;
    a.last = stamp; a.snooze = 0;
    if (!a.days.length) a.on = false;
    saveNow();
    startRinging('alarm');
    notify('Alarm', a.label || a.time);
    ringAlert(a.label || 'Alarm', a.time, [
      { label: 'Stop', cls: 'pri' },
      { label: 'Snooze 9 min', fn: () => { a.on = true; a.snooze = Date.now() + 9 * MIN; saveNow(); } }
    ]);
    refresh();
    break;
  }
}

/* ═══ CHARTS ═════════════════════════════════════════ */
/* Spider chart. axes: [label], series: [{name, values:[0..1], raw:[text], color, fill, dash}] */
function radarChart(axes, series, size = 360) {
  const n = axes.length, R = size * .33, cx = size / 2, cy = size / 2 + 4;
  const pt = (i, v) => { const a = (i / n) * 2 * Math.PI - Math.PI / 2; return [Math.cos(a) * R * v, Math.sin(a) * R * v]; };
  let grid = '';
  [.25, .5, .75, 1].forEach(l => {
    grid += `<polygon class="axis" fill="${l === 1 ? 'var(--track)' : 'none'}" points="${axes.map((_, i) => pt(i, l).map(v => v.toFixed(1)).join(',')).join(' ')}"/>`;
  });
  axes.forEach((_, i) => { const [x, y] = pt(i, 1); grid += `<line class="axis" x1="0" y1="0" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; });
  let polys = '';
  series.forEach((s, si) => {
    const pts = s.values.map((v, i) => pt(i, clamp(v, 0, 1.08)));
    polys += `<g class="radar-poly" style="animation-duration:${0.9 + si * .25}s">
      <polygon points="${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="${s.fill || 'none'}" stroke="${s.color}" stroke-width="${s.dash ? 1.6 : 2.4}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''} stroke-linejoin="round"/>
      ${s.dots !== false ? pts.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${s.dash ? 3 : 4.5}" fill="${s.color}" data-tip="${esc(s.name)} · ${esc(axes[i])}: ${esc(s.raw ? s.raw[i] : Math.round(s.values[i] * 100))}"/>`).join('') : ''}
    </g>`;
  });
  let labels = '';
  axes.forEach((a, i) => {
    const [x, y] = pt(i, 1.2);
    const anchor = Math.abs(x) < 8 ? 'middle' : x > 0 ? 'start' : 'end';
    const short = a.length > 16 ? a.slice(0, 15) + '…' : a;
    const main = series[0];
    labels += `<text class="lbl" x="${x.toFixed(1)}" y="${(y + (y > 0 ? 10 : -2)).toFixed(1)}" text-anchor="${anchor}">${esc(short)}</text>`;
    if (main && main.raw) labels += `<text class="val" x="${x.toFixed(1)}" y="${(y + (y > 0 ? 24 : 12)).toFixed(1)}" text-anchor="${anchor}">${esc(main.raw[i])}</text>`;
  });
  return `<svg viewBox="-70 0 ${size + 140} ${size + 10}" role="img" aria-label="Spider chart"><g transform="translate(${cx} ${cy})">${grid}${polys}${labels}</g></svg>`;
}
function legend(items) { return `<div class="legend">${items.map(i => `<span><i class="ln" style="border-color:${i.color};${i.dash ? 'border-top-style:dashed' : ''}"></i>${esc(i.name)}</span>`).join('')}</div>`; }

/* Stacked bars per day. days: [{key,label,parts:[{sid,ms}],total}] */
function barChart(days, goalMs, W = 720, H = 240) {
  const padL = 34, padB = 26, padT = 18, n = days.length;
  const max = Math.max(goalMs * 1.15, ...days.map(d => d.total), HOUR);
  const bw = (W - padL) / n, barW = Math.min(46, bw * .62);
  const y = v => H - padB - (v / max) * (H - padB - padT);
  let g = '';
  const stepH = max > 10 * HOUR ? 4 : max > 5 * HOUR ? 2 : 1;
  for (let h = 0; h * HOUR <= max; h += stepH) g += `<line class="axis" x1="${padL}" x2="${W}" y1="${y(h * HOUR).toFixed(1)}" y2="${y(h * HOUR).toFixed(1)}"/><text x="${padL - 6}" y="${(y(h * HOUR) + 4).toFixed(1)}" text-anchor="end" class="val">${h}h</text>`;
  if (goalMs) g += `<line x1="${padL}" x2="${W}" y1="${y(goalMs).toFixed(1)}" y2="${y(goalMs).toFixed(1)}" stroke="var(--gold)" stroke-dasharray="5 5" stroke-width="1.5"/><text x="${W}" y="${(y(goalMs) - 5).toFixed(1)}" text-anchor="end" class="val" style="fill:var(--gold)">goal</text>`;
  let bars = '';
  const today = todayKey();
  days.forEach((d, i) => {
    const x = padL + i * bw + (bw - barW) / 2;
    let acc = 0, rects = '';
    d.parts.forEach(p => {
      const y0 = y(acc + p.ms), h = y(acc) - y0;
      rects += `<rect x="${x.toFixed(1)}" y="${y0.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" fill="${colorOf(p.sid)}" rx="2" data-tip="${esc(fmtKey(d.key))} · ${esc(nameOf(p.sid))}: ${hm(p.ms)}" data-daykey="${d.key}"/>`;
      acc += p.ms;
    });
    if (!d.parts.length) rects = `<rect x="${x.toFixed(1)}" y="${(H - padB - 2).toFixed(1)}" width="${barW.toFixed(1)}" height="2" fill="var(--track)" data-daykey="${d.key}" data-tip="${esc(fmtKey(d.key))}: nothing"/>`;
    bars += `<g class="bar-g">${rects}</g>`;
    if (n <= 10 || i % Math.ceil(n / 10) === 0 || d.key === today)
      bars += `<text x="${(x + barW / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle" class="${d.key === today ? 'lbl' : ''}">${esc(d.label)}</text>`;
    if (n <= 10 && d.total) bars += `<text x="${(x + barW / 2).toFixed(1)}" y="${(y(d.total) - 5).toFixed(1)}" text-anchor="middle" class="val">${hmShort(d.total)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Study time per day">${g}${bars}</svg>`;
}

/* Chronological flowchart with animated connectors */
function flowSteps(k, demo) {
  const list = dayAgg(k, demo).list, steps = [];
  for (const s of list) {
    const last = steps[steps.length - 1];
    if (last && last.sid === s.sid && s.s0 - last.e0 < 5 * MIN) { last.e0 = s.e0; last.d += s.e0 - s.s0; continue; }
    if (last && s.s0 - last.e0 >= 15 * MIN) steps.push({ idle: true, s0: last.e0, e0: s.s0, d: s.s0 - last.e0 });
    steps.push({ sid: s.sid, s0: s.s0, e0: s.e0, d: s.e0 - s.s0, live: s.live });
  }
  return steps;
}
function flowChart(k, width) {
  const steps = flowSteps(k);
  if (!steps.length) return `<div class="empty"><b>No flow yet for ${fmtKey(k)}</b>Start a subject and your day turns into a flowchart here.</div>`;
  const W = Math.max(300, width || 900), nodeW = 168, nodeH = 66, gapX = 44, gapY = 46;
  const cols = Math.max(1, Math.floor((W + gapX) / (nodeW + gapX)));
  const rows = Math.ceil(steps.length / cols);
  const usedW = cols * nodeW + (cols - 1) * gapX, offX = (W - usedW) / 2;
  const H = rows * nodeH + (rows - 1) * gapY + 12;
  const pos = steps.map((_, i) => {
    const r = Math.floor(i / cols), c0 = i % cols, c = r % 2 ? cols - 1 - c0 : c0;
    return { x: offX + c * (nodeW + gapX), y: 6 + r * (nodeH + gapY), r };
  });
  let d = '';
  pos.forEach((p, i) => {
    const cx = p.x + nodeW / 2, cy = p.y + nodeH / 2;
    if (i === 0) { d += `M${cx.toFixed(1)} ${cy.toFixed(1)}`; return; }
    const q = pos[i - 1];
    if (q.r === p.r) d += `L${cx.toFixed(1)} ${cy.toFixed(1)}`;
    else { const qx = q.x + nodeW / 2, qy = q.y + nodeH / 2, my = (qy + cy) / 2; d += `C${qx.toFixed(1)} ${(my + 10).toFixed(1)} ${cx.toFixed(1)} ${(my - 10).toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)}`; }
  });
  let len = 0;
  pos.forEach((p, i) => { if (i) { const q = pos[i - 1]; len += Math.hypot(p.x - q.x, p.y - q.y) + 20; } });
  let arrows = '';
  pos.forEach((p, i) => {
    if (!i) return; const q = pos[i - 1];
    if (q.r !== p.r) return;
    const dir = p.x > q.x ? 1 : -1, ax = (dir > 0 ? q.x + nodeW : q.x) + dir * gapX / 2, ay = p.y + nodeH / 2;
    arrows += `<path d="M${(ax - dir * 5).toFixed(1)} ${(ay - 5).toFixed(1)}L${(ax + dir * 3).toFixed(1)} ${ay.toFixed(1)}L${(ax - dir * 5).toFixed(1)} ${(ay + 5).toFixed(1)}" fill="none" stroke="var(--dim)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  });
  const nodes = steps.map((s, i) => {
    const p = pos[i], col = s.idle ? 'var(--mute)' : colorOf(s.sid);
    const name = s.idle ? 'Idle gap' : nameOf(s.sid);
    const short = name.length > 18 ? name.slice(0, 17) + '…' : name;
    return `<g class="flow-node" style="animation-duration:${(.45 + Math.min(i, 12) * .06).toFixed(2)}s" data-tip="${esc(name)} · ${clockHM(s.s0)}–${clockHM(s.e0)} · ${hm(s.d)}">
      <rect x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}" width="${nodeW}" height="${nodeH}" rx="16" fill="var(--bg)" stroke="${col}" stroke-width="${s.live ? 2.5 : 1.5}" ${s.idle ? 'stroke-dasharray="4 4"' : ''}/>
      <rect x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}" width="${nodeW}" height="${nodeH}" rx="16" fill="${col}" fill-opacity="${s.idle ? .05 : .16}"/>
      <rect x="${(p.x + 12).toFixed(1)}" y="${(p.y + 14).toFixed(1)}" width="4" height="${nodeH - 28}" rx="2" fill="${col}"/>
      <text x="${(p.x + 26).toFixed(1)}" y="${(p.y + 28).toFixed(1)}" class="lbl" style="font-size:12.5px">${esc(short)}</text>
      <text x="${(p.x + 26).toFixed(1)}" y="${(p.y + 47).toFixed(1)}" class="val" style="font-size:11.5px">${clockHM(s.s0)} · ${hm(s.d)}${s.live ? ' · live' : ''}</text>
      <text x="${(p.x + nodeW - 12).toFixed(1)}" y="${(p.y + 47).toFixed(1)}" text-anchor="end" class="val" style="fill:var(--mute)">#${i + 1}</text>
    </g>`;
  }).join('');
  const dur = Math.max(3, steps.length * .9).toFixed(1);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Flowchart of the day">
    <path d="${d}" fill="none" stroke="var(--line)" stroke-width="3"/>
    <path class="flow-draw" d="${d}" fill="none" stroke="var(--dim)" stroke-opacity=".6" stroke-width="2" stroke-dasharray="${len.toFixed(0)}" style="--len:${len.toFixed(0)}"/>
    <path class="flow-ants" d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 12" stroke-linecap="round"/>
    ${arrows}
    ${nodes}
    ${reduced ? '' : `<circle r="6" fill="var(--accent)"><animateMotion dur="${dur}s" repeatCount="indefinite" path="${d}" rotate="auto"/></circle>
    <circle r="12" fill="var(--accent)" fill-opacity=".18"><animateMotion dur="${dur}s" repeatCount="indefinite" path="${d}"/></circle>`}
  </svg>`;
}
function flowSummary(k) {
  const steps = flowSteps(k).filter(s => !s.idle), pairs = {};
  for (let i = 1; i < steps.length; i++) { const key = steps[i - 1].sid + '>' + steps[i].sid; pairs[key] = (pairs[key] || 0) + 1; }
  const top = Object.entries(pairs).sort((a, b) => b[1] - a[1])[0];
  const switches = Math.max(0, steps.length - 1);
  const avg = steps.length ? steps.reduce((a, s) => a + s.d, 0) / steps.length : 0;
  return { switches, avg, top: top ? { from: top[0].split('>')[0], to: top[0].split('>')[1], n: top[1] } : null, blocks: steps.length };
}

/* Focus clock: study minutes per hour of day */
function hourRadial(a, b) {
  const hours = new Array(24).fill(0);
  for (const s of sessionsIn(a, b)) {
    if (kindOf(s.sid) !== 'study') continue;
    let t = s.s0;
    while (t < s.e0) {
      const d = new Date(t), hEnd = new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours() + 1).getTime();
      const e = Math.min(hEnd, s.e0); hours[d.getHours()] += e - t; t = e;
    }
  }
  const mx = Math.max(...hours, 1), peak = hours.indexOf(Math.max(...hours));
  let w = '';
  hours.forEach((v, h) => {
    const r1 = 60 + (v / mx) * 90;
    w += `<path class="wedge" d="${wedgePath(170, 170, 52, Math.max(r1, 56), h * 15 + 1, (h + 1) * 15 - 1)}" fill="${v ? 'var(--accent)' : 'var(--track)'}" fill-opacity="${v ? (.25 + .75 * v / mx).toFixed(2) : 1}" data-tip="${pad(h)}:00–${pad((h + 1) % 24)}:00 · ${hm(v)}"/>`;
  });
  let lab = '';
  [0, 6, 12, 18].forEach(h => { const [x, y] = polar(170, 170, 162, h * 15); lab += `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" class="val">${pad(h)}</text>`; });
  const any = hours.some(Boolean);
  return `<svg viewBox="0 0 340 340" role="img" aria-label="Study by hour of day">${w}${lab}
    <text x="170" y="164" text-anchor="middle" class="val">${any ? 'peak hour' : 'no study yet'}</text>
    <text x="170" y="190" text-anchor="middle" class="lbl" style="font-size:22px;font-family:var(--font-num)">${any ? pad(peak) + ':00' : '—'}</text></svg>`;
}

/* Calendar heatmap */
function heatmap(endK, weeks = 20, map) {
  const goal = S.settings.goalMin * MIN || 6 * HOUR;
  const end = keyDate(endK), dow = (end.getDay() + 6) % 7;
  const last = shiftKey(endK, 6 - dow);
  const first = shiftKey(last, -(weeks * 7 - 1));
  const today = todayKey();
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const k = shiftKey(first, i), v = (map[k] || {}).study || 0;
    const lvl = v <= 0 ? 0 : v < goal * .25 ? 1 : v < goal * .5 ? 2 : v < goal ? 3 : 4;
    const style = k > today ? 'opacity:.25' : lvl ? `background:color-mix(in srgb,var(--accent) ${[0, 25, 50, 75, 100][lvl]}%,var(--track))` : '';

  async call(method, params, form) {

    catch (e) {

    const len = Math.min((b % 2 ? 10 : 50) * MIN, now - t - MIN);
    if (len <= MIN) break;
    S.sessions.push({ id: uid(), sid, start: t, end: t + len, demo: true }); t += len + 3 * MIN;
  }
  saveNow(); closeSheet(); refresh(); toast('Demo week loaded — Telegram reports ignore it');
}
function clearDemo() { S.sessions = S.sessions.filter(s => !s.demo); saveNow(); closeSheet(); refresh(); toast('Demo data cleared'); }

/* ═══ EVENTS ═════════════════════════════════════════ */
function onClick(e) {
  const tab = e.target.closest('[data-tab]'); if (tab) return go(tab.dataset.tab);
  const g = e.target.closest('[data-go]'); if (g) { closeSheet(); return go(g.dataset.go); }
  if (e.target.closest('#scrim') || e.target.closest('[data-act="close-sheet"]')) return closeSheet();
  if (e.target.closest('#focus')) return focusClick(e);
  const inSheet = e.target.closest('#sheet');
  // view-level controls
  const rg = e.target.closest('[data-range]'); if (rg) { statRange = rg.dataset.range; return renderView(); }
  const sn = e.target.closest('[data-snav]'); if (sn) { const d = +sn.dataset.snav; statAnchor = d ? prevAnchor(statRange, statAnchor || todayKey(), d) : null; return renderView(); }
  const dk = e.target.closest('[data-daykey]'); if (dk && curTab === 'stats') { statRange = 'day'; statAnchor = dk.dataset.daykey; return renderView(); }
  const pn = e.target.closest('[data-pnav]'); if (pn) { const d = +pn.dataset.pnav; planKey = d ? shiftKey(planKey || todayKey(), d) : null; return renderView(); }
  const tn = e.target.closest('[data-tnav]'); if (tn) { const d = +tn.dataset.tnav; todoKey = d ? shiftKey(todoKey || todayKey(), d) : null; return renderView(); }
  const pk = e.target.closest('[data-picker]'); if (pk) { S.settings.picker = pk.dataset.picker; save(); return renderView(); }
  const sm = e.target.closest('[data-swmode]'); if (sm) { S.settings.swMode = sm.dataset.swmode; save(); return renderView(); }
  const ta = e.target.closest('[data-tact]'); if (ta) return timerAction(ta.closest('[data-tid]').dataset.tid, ta.dataset.tact);
  const sd = e.target.closest('[data-sess-del]'); if (sd) { if (confirm('Delete this session?')) { S.sessions = S.sessions.filter(s => s.id !== sd.dataset.sessDel); saveNow(); refresh(); } return; }
  const td = e.target.closest('[data-todo-del]'); if (td) { S.todos = S.todos.filter(t => t.id !== td.dataset.todoDel); saveNow(); return refresh(); }
  const cd = e.target.closest('[data-city-del]'); if (cd) { S.cities.splice(+cd.dataset.cityDel, 1); saveNow(); return refresh(); }
  const ad = e.target.closest('[data-alarm-del]'); if (ad) { S.alarms = S.alarms.filter(a => a.id !== ad.dataset.alarmDel); saveNow(); return refresh(); }
  if (e.target.closest('#island')) { const it = e.target.closest('[data-go]') || $('#island [data-go]'); if (it) go(it.dataset.go); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (inSheet && !['send-report', 'export', 'load-demo', 'clear-demo', 'reset', 'test-sound', 'notif'].includes(b.dataset.act)) return; // sheet handles its own
  const act = b.dataset.act;
  switch (act) {
    case 'toggle': toggleSubject(b.dataset.sid); break;
    case 'edit-subj': openSubjects(b.dataset.sid); break;
    case 'focus': openFocus(); break;
    case 'theme': { const i = THEMES.indexOf(S.settings.theme); setTheme(THEMES[(i + 1) % THEMES.length], e); toast(THEME_NAMES[THEMES[(i + 1) % THEMES.length]]); break; }
    case 'settings': openSettings(b.dataset.sec); break;
    case 'ddays': openDdays(); break;
    case 'send-report': sendReport(todayKey()); break;
    case 't-start': startTimer(pick, pickLabel.trim(), pickSid); break;
    case 't-clear': pick = 0; pickLabel = ''; pickSid = ''; renderView(); break;
    case 't-preset': pick = +b.dataset.dur; startTimer(pick, '', pickSid); break;
    case 't-recent': { const r = S.recents[+b.dataset.i]; if (r) startTimer(r.dur, r.label, ''); break; }
    case 'p-start': pomoStart(); break;
    case 'p-stop': pomoStop(); break;
    case 'p-skip': pomoSkip(); break;
    case 'sw-start': case 'sw-stop': case 'sw-lap': case 'sw-reset': swAction(act.slice(3)); break;
    case 'sw-flip': S.settings.swMode = S.settings.swMode === 'analog' ? 'digital' : 'analog'; save(); renderView(); break;
    case 'city-add': openCityAdd(); break;
    case 'alarm-add': openAlarmAdd(); break;
    case 'add-sess': addManualSession(); break;
    case 'todo-add': addTodo(); break;
    case 'todo-carry': { const k = todoKey || todayKey(), y = shiftKey(k, -1); S.todos.forEach(t => { if (t.day === y && !t.done) t.day = k; }); saveNow(); refresh(); break; }
    case 'export': exportData(); break;
    case 'load-demo': loadDemo(); break;
    case 'clear-demo': clearDemo(); break;
    case 'reset': if (confirm('Erase all sessions, tasks, timers and settings on this device?')) { localStorage.removeItem(KEY); location.reload(); } break;
    case 'test-sound': { ac(); const was = S.settings.sound; S.settings.sound = true; chime('done'); S.settings.sound = was; break; }
    case 'notif': if ('Notification' in window) Notification.requestPermission().then(p => { toast('Notifications: ' + p); b.textContent = p === 'granted' ? 'Allowed' : 'Allow'; }); break;
  }
}
function onChange(e) {
  const c = e.target.closest('[data-todo]');
  if (c) { const t = S.todos.find(x => x.id === c.dataset.todo); if (t) { t.done = c.checked; t.doneAt = c.checked ? Date.now() : 0; saveNow(); if (c.checked) chime('soft'); setTimeout(refresh, 380); } return; }
  const al = e.target.closest('[data-alarm-on]');
  if (al) { const a = S.alarms.find(x => x.id === al.dataset.alarmOn); if (a) { a.on = al.checked; a.snooze = 0; saveNow(); ac(); setTimeout(refresh, 300); } }
}
function onKey(e) {
  if (e.key === 'Escape') { if ($('#sheet').classList.contains('on')) closeSheet(); else if (focusOn) closeFocus(); return; }
  if (e.target.matches('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if ($('#sheet').classList.contains('on')) return;
  const n = +e.key;
  if (n >= 1 && n <= TABS.length) return go(TABS[n - 1][0]);
  const k = e.key.toLowerCase();
  if (k === 'f') return focusOn ? closeFocus() : openFocus();
  if (k === 't') return setTheme(THEMES[(THEMES.indexOf(S.settings.theme) + 1) % THEMES.length]);
  if (curTab === 'stopwatch') {
    if (e.key === ' ') { e.preventDefault(); swAction(S.sw.state === 'run' ? 'stop' : 'start'); }
    if (k === 'l' && S.sw.state === 'run') swAction('lap');
    if (k === 'r' && S.sw.state === 'pause') swAction('reset');
  }
}

/* ═══ LOOP & BOOT ════════════════════════════════════ */
let lastMin = -1, lastDay = '';
function loop() {
  try {
    renderTop();
    checkTimers(); checkPomo();
    const V = Views[curTab];
    if (V && V.tick) V.tick($('#v-' + curTab));
    if (focusOn) drawFocus();
    const m = new Date().getMinutes();
    if (m !== lastMin) {
      lastMin = m; checkAlarms(); tgAuto();
      const d = todayKey(); if (d !== lastDay) { if (lastDay) refresh(); lastDay = d; }
    }
  } catch (e) { console.error(e); }
}
function boot() {
  const nj = document.getElementById('nojs'); if (nj) nj.remove();
  load();
  document.documentElement.dataset.theme = S.settings.theme;
  applyGlass();
  buildTabs();
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKey);
  $('#island').addEventListener('keydown', e => { if (e.key === 'Enter') { const it = $('#island [data-go]'); if (it) go(it.dataset.go); } });
  document.addEventListener('pointerdown', () => ac(), { once: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); tgAuto(); } });
  addEventListener('online', tgAuto);
  let rz = 0;
  addEventListener('resize', () => { moveInd(); clearTimeout(rz); rz = setTimeout(() => { if (curTab === 'stats') Views.stats.drawFlow($('#v-stats')); }, 200); });
  addEventListener('storage', e => { if (e.key === KEY) { load(); refresh(); } });
  applyTab(S.settings.tab || 'today');
  lastDay = todayKey();
  setInterval(loop, 250);
  loop();
  requestAnimationFrame(swLoop);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInd);
  setTimeout(moveInd, 400);
}

try{boot();}catch(e){console.error(e);var v=document.getElementById('v-today');if(v){v.classList.add('active');v.innerHTML='<div class="panel" style="margin:20px">Clock of Master failed to start: '+String(e&&e.message)+'</div>';}}
})();
</script>
